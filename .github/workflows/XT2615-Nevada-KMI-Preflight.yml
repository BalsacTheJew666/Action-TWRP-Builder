name: XT2615-1 Nevada - KMI Preflight (Non-flashable)

# Diagnostic-only: never runs on pushes or pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nevada-kmi-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kmi-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      MOTOROLA_BRANCH: android-16-release-w1wn36.18-114
      MOTOROLA_COMMIT: 0fa176ca7f56c349b51acd83684284c02ced5854
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout diagnostic scripts
        uses: actions/checkout@v4

      - name: Free runner disk and install host compiler
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo apt-get clean
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev dwarves \
            python3 git rsync cpio xz-utils zstd lz4
          clang --version | head -n 1
          free -h
          df -h /

      - name: Download exactly pinned Motorola 5.15 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --filter=blob:none \
            --branch "$MOTOROLA_BRANCH" \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git \
            "$RUNNER_TEMP/nevada-kernel"
          actual="$(git -C "$RUNNER_TEMP/nevada-kernel" rev-parse HEAD)"
          test "$actual" = "$MOTOROLA_COMMIT" || {
            echo "::error::Motorola branch moved: expected $MOTOROLA_COMMIT, got $actual"
            exit 1
          }
          echo "Verified Motorola source revision: $actual"

      - name: Compile GKI KMI preflight preserving modular Wi-Fi
        timeout-minutes: 120
        shell: bash
        env:
          KERNEL_DIR: ${{ runner.temp }}/nevada-kernel
          OUT_DIR: ${{ runner.temp }}/nevada-kmi-out
        run: |
          set -euo pipefail
          monitor() {
            while :; do
              echo "=== Memory and disk $(date -u +%FT%TZ) ==="
              free -m
              df -h "$RUNNER_TEMP" | tail -n 1
              if [[ -r /sys/fs/cgroup/memory.events ]]; then
                cat /sys/fs/cgroup/memory.events
              fi
              sleep 60
            done
          }
          monitor &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          bash scripts/nevada-kmi-preflight.sh 2>&1 | tee "$RUNNER_TEMP/nevada-kmi-build.log"
          kill "$monitor_pid" 2>/dev/null || true
          trap - EXIT

      - name: Prepare KMI audit files only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nevada-kmi-audit"
          out="$RUNNER_TEMP/nevada-kmi-out"
          mkdir -p "$dir"
          cp "$out/vmlinux.symvers" "$dir/"
          if [[ -s "$out/Module.symvers" ]]; then
            cp "$out/Module.symvers" "$dir/"
          fi
          cp "$out/.config" "$dir/config.kmi-preflight"
          cp "$out/config.gki-original" "$dir/"
          cp "$out/kernelrelease.txt" "$dir/"
          cp "$out/kmi-preflight.txt" "$dir/"
          cp "$out/kmi-preflight.sha256" "$dir/"
          printf '%s\n' \
            "READ-ONLY ANALYSIS ONLY; NOT A FLASHABLE KERNEL." \
            "This GKI/ThinLTO/Ubuntu-Clang build is not stock ABI verified." \
            "Stock Motorola modules and init_boot KernelSU were NOT used." \
            "Use vmlinux.symvers for candidate built-in exported-symbol CRCs." \
            "Before device use, compare stock vendor imports/CRCs and build with matching firmware compiler/KMI." \
            > "$dir/NOT-FLASHABLE.txt"

      - name: Upload public-source KMI inspection data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-kmi-preflight-NOT-FLASHABLE
          path: ${{ runner.temp }}/nevada-kmi-audit/
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-kmi-preflight-log
          path: ${{ runner.temp }}/nevada-kmi-build.log
          if-no-files-found: ignore
          retention-days: 7
