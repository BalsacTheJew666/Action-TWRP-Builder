name: XT2615-1 Nevada - Reconstruct Public GKI KMI Export Superset

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/XT2615-Nevada-AR9271-Public-GKI-KMI-Superset.yml'
      - 'scripts/nevada-ar9271-public-gki-superset.py'
      - 'ci/nevada-ar9271-core-kmi.tsv'
      - 'ci/xt2615-nevada-stock.config'
      - 'NEVADA-AR9271-PUBLIC-KMI-SUPERSET.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nevada-public-gki-kmi-superset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research-only-public-kmi-superset:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      MOTOROLA_BRANCH: android-16-release-w1wn36.18-114
      MOTOROLA_SOURCE_SHA: 0fa176ca7f56c349b51acd83684284c02ced5854
      STOCK_CONFIG_SHA256: e3cdaf997a7e2eb70e441944bdfd9af359aa82e8a2d5cb9534d2bce5fcd4a78a
      OFFICIAL_GKI_URL: https://ci.android.com/builds/submitted/14563692/kernel_aarch64/latest/raw/vmlinux.symvers
    steps:
      - name: Checkout ONLY public research scripts
        uses: actions/checkout@v4

      - name: Verify pinned original Motorola stock config and research scripts
        shell: bash
        run: |
          set -euo pipefail
          echo "$STOCK_CONFIG_SHA256  ci/xt2615-nevada-stock.config" | sha256sum -c -
          grep -Fqx "CONFIG_TRIM_UNUSED_KSYMS=y" ci/xt2615-nevada-stock.config
          grep -Fqx "CONFIG_MODULE_SIG_PROTECT=y" ci/xt2615-nevada-stock.config
          grep -Fqx "CONFIG_MODVERSIONS=y" ci/xt2615-nevada-stock.config
          grep -Fqx "CONFIG_CFI_CLANG=y" ci/xt2615-nevada-stock.config
          python3 -m py_compile scripts/nevada-ar9271-public-gki-superset.py
          mkdir -p "$RUNNER_TEMP/public-kmi-proof"

      - name: Fetch authentic Google GKI 14563692 export CRC reference
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 2 \
            --connect-timeout 15 --max-time 120 \
            "$OFFICIAL_GKI_URL" -o "$RUNNER_TEMP/official-vmlinux.symvers"
          test -s "$RUNNER_TEMP/official-vmlinux.symvers"
          sha256sum "$RUNNER_TEMP/official-vmlinux.symvers"

      - name: Generate all-official-GKI export-name superset plus 2 AR9271 names
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/nevada-ar9271-public-gki-superset.py \
            "$RUNNER_TEMP/official-vmlinux.symvers" \
            ci/nevada-ar9271-core-kmi.tsv \
            "$RUNNER_TEMP/public-kmi-proof"

      - name: Fetch only SHA-pinned public Motorola source and verify whitelist handling
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --single-branch --filter=blob:none \
            -b "$MOTOROLA_BRANCH" \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git \
            "$RUNNER_TEMP/moto-public"
          test "$(git -C "$RUNNER_TEMP/moto-public" rev-parse HEAD)" = "$MOTOROLA_SOURCE_SHA"
          test -r "$RUNNER_TEMP/moto-public/scripts/gen_autoksyms.sh"
          work="$RUNNER_TEMP/ksym-superset-control"
          mkdir -p "$work/include/config"
          printf 'CONFIG_MODVERSIONS=y\nCONFIG_UNUSED_KSYMS_WHITELIST="%s"\n' \
            "$RUNNER_TEMP/public-kmi-proof/PUBLIC-GKI-ALL-EXPORTS-PLUS-TWO-NOT-VENDOR-COMPLETE.symbollist" \
            > "$work/include/config/auto.conf"
          (
            cd "$work"
            abs_srctree="$RUNNER_TEMP/moto-public" \
              /bin/sh "$RUNNER_TEMP/moto-public/scripts/gen_autoksyms.sh" "$work/autoksyms.h"
          )
          python3 - "$RUNNER_TEMP/public-kmi-proof" "$work/autoksyms.h" <<'PY'
          import pathlib,sys
          folder,autoksyms=pathlib.Path(sys.argv[1]),pathlib.Path(sys.argv[2])
          raw=(folder/"PUBLIC-GKI-ALL-EXPORTS-PLUS-TWO-NOT-VENDOR-COMPLETE.symbollist").read_text().splitlines()
          generated=autoksyms.read_text()
          present=set()
          for line in generated.splitlines():
              if line.startswith("#define __KSYM_") and line.endswith(" 1"):
                  present.add(line[len("#define __KSYM_"):-2])
          assert set(raw)|{"module_layout"}==present, (
              f"KMI export names missing={set(raw)-present}, unexpected={present-set(raw)-{'module_layout'}}")
          for name in ("usb_get_urb","rfkill_pause_polling","usb_submit_urb",
                       "ieee80211_alloc_hw_nm","module_layout"):
              if name in ("ieee80211_alloc_hw_nm",) and name not in raw:
                  continue # ieee80211_alloc_hw_nm belongs to stock mac80211 module, not core
              assert name in present,name
          print(f"PASS: Motorola autoksyms generator recognized {len(present)} requested macro names")
          PY
          cp "$work/autoksyms.h" "$RUNNER_TEMP/public-kmi-proof/GENERATED-AUTOKSYMS-FROM-SUPERSET.h"

      - name: Upload text-only PUBLIC baseline and explicit incomplete warning
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-AR9271-PUBLIC-GKI-EXPORT-SUPERSET-NOT-VENDOR-COMPLETE
          path: |
            ${{ runner.temp }}/public-kmi-proof/PUBLIC-GKI-ALL-EXPORTS-PLUS-TWO-NOT-VENDOR-COMPLETE.symbollist
            ${{ runner.temp }}/public-kmi-proof/PUBLIC-GKI-SUPERSET-ABIGATE.json
            ${{ runner.temp }}/public-kmi-proof/README-NEVER-FLASH.txt
            ${{ runner.temp }}/public-kmi-proof/GENERATED-AUTOKSYMS-FROM-SUPERSET.h
          if-no-files-found: warn
          retention-days: 14
