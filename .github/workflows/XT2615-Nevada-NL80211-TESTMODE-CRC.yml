name: XT2615-1 Nevada - Stock NL80211 Testmode CRC Control

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/XT2615-Nevada-NL80211-TESTMODE-CRC.yml'
      - 'scripts/nevada-mac80211-nl80211-testmode-crc.sh'
      - 'ci/nevada-stock-testmode-btf-evidence.json'
      - 'NEVADA-NL80211-TESTMODE-CRC.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nevada-testmode-crc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock-testmode-crc-control:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      MOTO_BRANCH: android-16-release-w1wn36.18-114
      MOTO_SHA: 0fa176ca7f56c349b51acd83684284c02ced5854
      STOCK_CONFIG_SHA256: e3cdaf997a7e2eb70e441944bdfd9af359aa82e8a2d5cb9534d2bce5fcd4a78a
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout analysis scripts and stock BTF evidence
        uses: actions/checkout@v4

      - name: Verify stock .config and extracted BTF evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "$STOCK_CONFIG_SHA256  ci/xt2615-nevada-stock.config" | sha256sum -c -
          python3 - <<'PY'
          import json
          e=json.load(open('ci/nevada-stock-testmode-btf-evidence.json'))
          b=e['btf']
          assert b['struct']=='ieee80211_ops'
          assert b['number_of_members']==115 and b['size_bytes']==920
          assert b['module_local_member_names_decoded']==98
          assert b['external_base_member_names_unresolved']==17
          names={x['name']:x['member_index'] for x in b['observed']}
          assert names['testmode_cmd']==50 and names['testmode_dump']==51
          assert names['sta_remove']==32 and names['sta_notify']==33
          assert e['stock_export_crc_ieee80211_alloc_hw_nm']=='0x561b7fc2'
          print('PASS: stock Wi-Fi BTF testmode callbacks present in ELF evidence')
          PY

      - name: Install LLVM and ARM64 build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev dwarves \
            python3 git rsync cpio xz-utils zstd lz4 file
          clang --version | head -1

      - name: Fetch and verify pinned public Motorola kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --filter=blob:none --single-branch \
            --branch "$MOTO_BRANCH" \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git \
            "$RUNNER_TEMP/moto-src"
          test "$(git -C "$RUNNER_TEMP/moto-src" rev-parse HEAD)" = "$MOTO_SHA"
          grep -q '^#ifdef CONFIG_NL80211_TESTMODE' "$RUNNER_TEMP/moto-src/include/net/mac80211.h"
          grep -q 'testmode_cmd' "$RUNNER_TEMP/moto-src/include/net/mac80211.h"
          grep -q 'testmode_dump' "$RUNNER_TEMP/moto-src/include/net/mac80211.h"

      - name: Compare FullLTO Wi-Fi CRC testmode OFF and ON
        shell: bash
        timeout-minutes: 28
        env:
          KERNEL_DIR: ${{ runner.temp }}/moto-src
          OUT_ROOT: ${{ runner.temp }}/nevada-testmode-crc
          STOCK_CONFIG: ${{ github.workspace }}/ci/xt2615-nevada-stock.config
        run: |
          set -euo pipefail
          bash scripts/nevada-mac80211-nl80211-testmode-crc.sh 2>&1 |
            tee "$RUNNER_TEMP/nevada-testmode-crc.log"

      - name: Upload type traces and CRC analysis, NO modules
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-NL80211-TESTMODE-CRC-NOT-INSTALLABLE
          path: ${{ runner.temp }}/nevada-testmode-crc/evidence/
          retention-days: 7

      - name: Upload diagnostic compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-NL80211-TESTMODE-CRC-logs
          path: ${{ runner.temp }}/nevada-testmode-crc.log
          if-no-files-found: ignore
          retention-days: 7
