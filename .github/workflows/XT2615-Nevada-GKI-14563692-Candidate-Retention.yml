name: XT2615-1 Nevada - GKI 14563692 Candidate Retention Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/XT2615-Nevada-GKI-14563692-Candidate-Retention.yml'
      - 'scripts/nevada-ar9271-gki14563692-candidate-retention.py'
      - 'ci/nevada-ar9271-core-kmi.tsv'
      - 'ci/xt2615-nevada-stock.config'
      - 'NEVADA-AR9271-GKI-KMI-SUPERSET.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nevada-gki-kmi-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gki-public-retention-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      MOTO_BRANCH: android-16-release-w1wn36.18-114
      MOTO_SHA: 0fa176ca7f56c349b51acd83684284c02ced5854
      GKI_SYMVERS_URL: https://ci.android.com/builds/submitted/14563692/kernel_aarch64/latest/raw/vmlinux.symvers
      STOCK_CONFIG_SHA256: e3cdaf997a7e2eb70e441944bdfd9af359aa82e8a2d5cb9534d2bce5fcd4a78a
    steps:
      - name: Checkout repository analysis, not boot artifacts
        uses: actions/checkout@v4

      - name: Verify immutable user stock configuration and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          echo "$STOCK_CONFIG_SHA256  ci/xt2615-nevada-stock.config" | sha256sum -c -
          python3 -m py_compile scripts/nevada-ar9271-gki14563692-candidate-retention.py

      - name: Download exact official GKI 14563692 export CRC reference
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 2 --connect-timeout 15 --max-time 90 \
            "$GKI_SYMVERS_URL" -o "$RUNNER_TEMP/official-GKI-14563692-vmlinux.symvers"
          test -s "$RUNNER_TEMP/official-GKI-14563692-vmlinux.symvers"
          sha256sum "$RUNNER_TEMP/official-GKI-14563692-vmlinux.symvers"

      - name: Construct conservative GKI export superset plus two Atheros dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/nevada-ar9271-gki14563692-candidate-retention.py \
            --gki-symvers "$RUNNER_TEMP/official-GKI-14563692-vmlinux.symvers" \
            --core-import-manifest ci/nevada-ar9271-core-kmi.tsv \
            --stock-config ci/xt2615-nevada-stock.config \
            --output-dir "$RUNNER_TEMP/gki-candidate"
          test "$(wc -l < "$RUNNER_TEMP/gki-candidate/CANDIDATE-RESEARCH-ONLY-NOT-VENDOR-ABI-WHITELIST.txt")" -eq 8473

      - name: Fetch pinned public Motorola kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --filter=blob:none \
            --branch "$MOTO_BRANCH" \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git \
            "$RUNNER_TEMP/moto-kernel"
          test "$(git -C "$RUNNER_TEMP/moto-kernel" rev-parse HEAD)" = "$MOTO_SHA"

      - name: Source-only check actual gen_autoksyms retains ALL 8473 candidate names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gki-generator/include/config"
          ALLOWLIST="$RUNNER_TEMP/gki-candidate/CANDIDATE-RESEARCH-ONLY-NOT-VENDOR-ABI-WHITELIST.txt"
          printf 'CONFIG_MODVERSIONS=y\nCONFIG_UNUSED_KSYMS_WHITELIST="%s"\n' "$ALLOWLIST" \
            > "$RUNNER_TEMP/gki-generator/include/config/auto.conf"
          (
            cd "$RUNNER_TEMP/gki-generator"
            abs_srctree="$RUNNER_TEMP/moto-kernel" \
              /bin/sh "$RUNNER_TEMP/moto-kernel/scripts/gen_autoksyms.sh" \
              "$RUNNER_TEMP/gki-generator/autoksyms.h"
          )
          python3 - "$ALLOWLIST" "$RUNNER_TEMP/gki-generator/autoksyms.h" <<'PY'
          import pathlib,sys
          wanted=set(pathlib.Path(sys.argv[1]).read_text().splitlines())
          macros=pathlib.Path(sys.argv[2]).read_text()
          retained={line.removeprefix("#define __KSYM_").removesuffix(" 1")
                    for line in macros.splitlines()
                    if line.startswith("#define __KSYM_") and line.endswith(" 1")}
          assert len(wanted)==8473,len(wanted)
          assert wanted<=retained,(len(wanted-retained),sorted(wanted-retained)[:20])
          assert retained-wanted <= {"module_layout"},sorted(retained-wanted)[:20]
          assert all(x in retained for x in ("usb_get_urb","rfkill_pause_polling"))
          print("PASS: pinned source gen_autoksyms retains exactly",
                len(wanted),"candidate exports (+ module_layout if needed)")
          print("WARNING: NOT Motorola's complete original KMI symbol list.")
          PY

      - name: Upload research-only text; never upload boot or kernel images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-GKI14563692-8473-CANDIDATE-KMI-NOT-BOOTABLE
          path: |
            ${{ runner.temp }}/gki-candidate/CANDIDATE-RESEARCH-ONLY-NOT-VENDOR-ABI-WHITELIST.txt
            ${{ runner.temp }}/gki-candidate/KMI-GKI-14563692-CANDIDATE-EVIDENCE.json
          if-no-files-found: warn
          retention-days: 14
