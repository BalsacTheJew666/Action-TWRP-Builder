name: XT2615-1 Nevada - TESTMODE AR9271 CRC Rebuild

# A static ABI experiment; never writes anything to the phone.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/XT2615-Nevada-AR9271-TESTMODE-Rebuild.yml'
      - 'scripts/nevada-ar9271-testmode-stockabi-build.sh'
      - 'ci/xt2615-nevada-stock.config'
      - 'scripts/nevada-ar9271-testmode-crc-audit.py'
      - 'ci/nevada-stock-wifi-vs-ath9k-htc-crcs.csv'
      - 'NEVADA-AR9271-TESTMODE-REBUILD.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nevada-testmode-ar9271-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ath9k-htc-testmode-abi-rebuild:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      MOTOROLA_BRANCH: android-16-release-w1wn36.18-114
      MOTOROLA_COMMIT: 0fa176ca7f56c349b51acd83684284c02ced5854
      STOCK_CONFIG_SHA256: e3cdaf997a7e2eb70e441944bdfd9af359aa82e8a2d5cb9534d2bce5fcd4a78a
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout diagnostic scripts and reference configuration
        uses: actions/checkout@v4

      - name: Verify original stock Kconfig and saved 30-symbol Wi-Fi reference
        shell: bash
        run: |
          set -euo pipefail
          echo "$STOCK_CONFIG_SHA256  ci/xt2615-nevada-stock.config" |
            sha256sum -c -
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=Path('ci/nevada-stock-wifi-vs-ath9k-htc-crcs.csv')
          rows=list(csv.DictReader(p.open()))
          assert len(rows)==30, 'Expected 30 previously audited stock wireless imports'
          matches=sum(r['import_crc']==r['stock_crc'] for r in rows)
          assert matches==29, 'Original fixture changed: expected 29 matching + 1 mismatched CRC'
          mismatch=[r for r in rows if r['import_crc']!=r['stock_crc']]
          assert len(mismatch)==1 and mismatch[0]['symbol']=='ieee80211_alloc_hw_nm'
          assert mismatch[0]['stock_crc']=='0x561b7fc2'
          print('PASS: Stock wireless ABI reference snapshot unchanged')
          PY

      - name: Install compiler and ARM64 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo apt-get clean
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev dwarves \
            python3 git rsync cpio xz-utils zstd lz4
          clang --version | head -1
          df -h /
          free -h

      - name: Fetch pinned Motorola kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --filter=blob:none \
            --branch "$MOTOROLA_BRANCH" \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git \
            "$RUNNER_TEMP/nevada-kernel"
          actual="$(git -C "$RUNNER_TEMP/nevada-kernel" rev-parse HEAD)"
          test "$actual" = "$MOTOROLA_COMMIT" || {
            echo "::error::Pinned source changed; refusing to use another commit"
            exit 1
          }

      - name: Compile four TESTMODE-enabled AR9271 modules and audit all 30 stock imports
        shell: bash
        timeout-minutes: 125
        env:
          KERNEL_DIR: ${{ runner.temp }}/nevada-kernel
          OUT_DIR: ${{ runner.temp }}/nevada-stockabi-out
          REFERENCE_CONFIG: ${{ github.workspace }}/ci/xt2615-nevada-stock.config
          STOCK_REFERENCE_CSV: ${{ github.workspace }}/ci/nevada-stock-wifi-vs-ath9k-htc-crcs.csv
          CRC_AUDIT_SCRIPT: ${{ github.workspace }}/scripts/nevada-ar9271-testmode-crc-audit.py
        run: |
          set -euo pipefail
          monitor() {
            while :; do
              echo "=== Resources $(date -u +%FT%TZ) ==="
              free -m
              df -h "$RUNNER_TEMP" | tail -1
              sleep 90
            done
          }
          monitor &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          bash scripts/nevada-ar9271-testmode-stockabi-build.sh 2>&1 |
            tee "$RUNNER_TEMP/nevada-ar9271-testmode-build.log"

      - name: Upload static ABI evidence, not installable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-AR9271-TESTMODE-30-CRC-DIAGNOSTIC-NOT-INSTALLABLE
          path: ${{ runner.temp }}/nevada-stockabi-out/stock-abi-audit/
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-AR9271-TESTMODE-rebuild-log
          path: ${{ runner.temp }}/nevada-ar9271-testmode-build.log
          if-no-files-found: ignore
          retention-days: 7
