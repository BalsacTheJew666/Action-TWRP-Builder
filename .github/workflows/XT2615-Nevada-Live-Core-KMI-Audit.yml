name: XT2615-1 Nevada - Read-only Live Core KMI Audit Selftest

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/nevada-ar9271-live-core-kmi-witness.py'
      - 'ci/nevada-ar9271-core-kmi.tsv'
      - 'ci/nevada-recovery-core-kmi-evidence.json'
      - '.github/workflows/XT2615-Nevada-Live-Core-KMI-Audit.yml'
      - 'NEVADA-AR9271-LIVE-CORE-KMI.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout non-installable read-only audit
        uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/nevada-ar9271-live-core-kmi-witness.py
      - name: Confirm manifest and preserved recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('ci/nevada-ar9271-core-kmi.tsv'),delimiter='\t'))
          assert len(rows)==101 and len({r['symbol'] for r in rows})==101
          assert {r['symbol']:r['crc'] for r in rows}['usb_submit_urb']=='0x61a2317d'
          assert {r['symbol']:r['crc'] for r in rows}['module_layout']=='0x0222dd63'
          report=json.load(open('ci/nevada-recovery-core-kmi-evidence.json'))
          assert report['unique_core_symbols']==101
          assert report['recovery_module_witnessed']==83
          assert report['recovery_module_crc_conflicts']==0
          assert len(report['not_witnessed'])==18
          print('PASS: 101 actual candidate core requirements, 83 recovery witnesses and 18 gaps')
          PY
      - name: Test ELF __versions parser with synthetic data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,struct
          path='scripts/nevada-ar9271-live-core-kmi-witness.py'
          spec=importlib.util.spec_from_file_location('witness',path)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          shstr=b'\0.shstrtab\0__versions\0'
          body=struct.pack('<Q',0x61a2317d)+b'usb_submit_urb\0'.ljust(56,b'\0')
          obj=bytearray(512)
          obj[:16]=b'\x7fELF\x02\x01\x01'+bytes(9)
          shoff=320
          struct.pack_into('<HHIQQQIHHHHHH',obj,16,1,183,1,0,0,shoff,0,64,0,0,64,3,1)
          obj[64:64+len(shstr)]=shstr
          obj[112:176]=body
          sh='<IIQQQQIIQQ'
          struct.pack_into(sh,obj,shoff+64,1,3,0,0,64,len(shstr),0,0,1,0)
          struct.pack_into(sh,obj,shoff+128,11,1,0,0,112,64,0,0,8,64)
          assert m.imports(bytes(obj))=={'usb_submit_urb':0x61a2317d}
          assert m.imports(b'invalid')=={}
          print('PASS: safe parser reads imported Linux 5.15 ELF CRC records')
          PY
      - name: Confirm no image/module installation is attempted
        run: |
          echo "CI validates a read-only script and saved public CRC metadata only."
          echo "No kernel modules, vendor images, secrets or user partitions are modified."
          echo "Live normal-boot kernel exports and loader compatibility remain unproven."
