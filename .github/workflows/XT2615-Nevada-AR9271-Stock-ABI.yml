name: XT2615-1 Nevada - Stock Config AR9271 ABI Probe

# A static ABI experiment; never writes anything to the phone.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/XT2615-Nevada-AR9271-Stock-ABI.yml'
      - 'scripts/nevada-ar9271-stockabi-probe.sh'
      - 'ci/xt2615-nevada-stock.config'
      - 'NEVADA-STOCK-ABI-PROBE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nevada-stockabi-ar9271-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock-config-ar9271-crc:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      MOTOROLA_BRANCH: android-16-release-w1wn36.18-114
      MOTOROLA_COMMIT: 0fa176ca7f56c349b51acd83684284c02ced5854
      STOCK_CONFIG_SHA256: e3cdaf997a7e2eb70e441944bdfd9af359aa82e8a2d5cb9534d2bce5fcd4a78a
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout diagnostic scripts and reference configuration
        uses: actions/checkout@v4

      - name: Verify original user-provided stock Kconfig checksum
        shell: bash
        run: |
          set -euo pipefail
          echo "$STOCK_CONFIG_SHA256  ci/xt2615-nevada-stock.config" |
            sha256sum -c -

      - name: Install compiler and ARM64 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo apt-get clean
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev dwarves \
            python3 git rsync cpio xz-utils zstd lz4
          clang --version | head -1
          df -h /
          free -h

      - name: Fetch pinned Motorola kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --filter=blob:none \
            --branch "$MOTOROLA_BRANCH" \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git \
            "$RUNNER_TEMP/nevada-kernel"
          actual="$(git -C "$RUNNER_TEMP/nevada-kernel" rev-parse HEAD)"
          test "$actual" = "$MOTOROLA_COMMIT" || {
            echo "::error::Pinned source changed; refusing to use another commit"
            exit 1
          }

      - name: Build CRC diagnostic only (non-flashable)
        shell: bash
        timeout-minutes: 125
        env:
          KERNEL_DIR: ${{ runner.temp }}/nevada-kernel
          OUT_DIR: ${{ runner.temp }}/nevada-stockabi-out
          REFERENCE_CONFIG: ${{ github.workspace }}/ci/xt2615-nevada-stock.config
        run: |
          set -euo pipefail
          monitor() {
            while :; do
              echo "=== Resources $(date -u +%FT%TZ) ==="
              free -m
              df -h "$RUNNER_TEMP" | tail -1
              sleep 90
            done
          }
          monitor &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          bash scripts/nevada-ar9271-stockabi-probe.sh 2>&1 |
            tee "$RUNNER_TEMP/nevada-stockabi-build.log"

      - name: Upload static ABI evidence, not installable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-AR9271-STOCK-CONFIG-CRC-NOT-INSTALLABLE
          path: ${{ runner.temp }}/nevada-stockabi-out/stock-abi-audit/
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-AR9271-STOCK-CONFIG-build-log
          path: ${{ runner.temp }}/nevada-stockabi-build.log
          if-no-files-found: ignore
          retention-days: 7
