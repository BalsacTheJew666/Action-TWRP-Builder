name: XT2615-1 Nevada - Safe AR9271 GKI Export Retention Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/XT2615-Nevada-AR9271-GKI-Export-Proof.yml'
      - 'scripts/nevada-ar9271-kmi-retention-microtest.sh'
      - 'NEVADA-AR9271-KMI-EXPORT-RETENTION.md'
      - 'ci/xt2615-nevada-stock.config'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nevada-gki-export-retention-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove-source-kmi-whitelist-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MOTO_BRANCH: android-16-release-w1wn36.18-114
      MOTO_SHA: 0fa176ca7f56c349b51acd83684284c02ced5854
      STOCK_CONFIG_SHA256: e3cdaf997a7e2eb70e441944bdfd9af359aa82e8a2d5cb9534d2bce5fcd4a78a
    steps:
      - name: Checkout safe public diagnostic tooling
        uses: actions/checkout@v4

      - name: Verify stock config and read-only test syntax
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            "$STOCK_CONFIG_SHA256" ci/xt2615-nevada-stock.config | sha256sum -c -
          bash -n scripts/nevada-ar9271-kmi-retention-microtest.sh

      - name: Fetch pinned Motorola kernel-mtk source only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --filter=blob:none \
            --branch "$MOTO_BRANCH" \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git \
            "$RUNNER_TEMP/moto-kernel"
          test "$(git -C "$RUNNER_TEMP/moto-kernel" rev-parse HEAD)" = "$MOTO_SHA"

      - name: Compare actual gen_autoksyms behavior with and without 2 exports
        shell: bash
        env:
          KERNEL_DIR: ${{ runner.temp }}/moto-kernel
          STOCK_CONFIG: ${{ github.workspace }}/ci/xt2615-nevada-stock.config
          RESULT_DIR: ${{ runner.temp }}/proof
        run: |
          set -euo pipefail
          bash scripts/nevada-ar9271-kmi-retention-microtest.sh
          test -s "$RESULT_DIR/README-SOURCE-ONLY-NOT-A-KERNEL.txt"
          test -s "$RESULT_DIR/control/autoksyms.h"
          test -s "$RESULT_DIR/retained/autoksyms.h"
          echo 'CI verified autoksyms behavior; no kernel or module built.'

      - name: Upload text-only source KMI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevada-AR9271-KMI-TWO-EXPORT-PROOF-NOT-A-KERNEL
          path: |
            ${{ runner.temp }}/proof/README-SOURCE-ONLY-NOT-A-KERNEL.txt
            ${{ runner.temp }}/proof/PROOF-ONLY-MINIMAL-WHITELIST.txt
            ${{ runner.temp }}/proof/CONTROL-EMPTY-WHITELIST.txt
            ${{ runner.temp }}/proof/control/autoksyms.h
            ${{ runner.temp }}/proof/retained/autoksyms.h
          if-no-files-found: warn
          retention-days: 14
